# ==================== API & DASHBOARD ====================

api:
  dashboard: true
  insecure: true

# ==================== ENTRYPOINTS ====================

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

# ==================== PROVIDERS ====================

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

# ==================== LOGS ====================

log:
  level: INFO

accessLog: {}