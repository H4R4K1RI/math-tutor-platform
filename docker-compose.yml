services:
  # ==================== TRAEFIK ====================
  traefik:
    image: traefik:v3.1
    container_name: math-tutor-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - ./certs:/certs:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    environment:
      - DOCKER_HOST=tcp://host.docker.internal:2375
    networks:
      - math-tutor-network

  # ==================== DATABASE ====================
  db:
    image: postgres:16
    container_name: math-tutor-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: math_tutor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - math-tutor-network

  # ==================== BACKEND ====================
  backend:
    build: ./backend
    container_name: math-tutor-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD}@db:5432/math_tutor
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-in-production-please-32chars}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      COOKIE_SECURE: "false"
      FRONTEND_URL: https://tutor-platform.localhost
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./backend/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - math-tutor-network

  # ==================== FRONTEND ====================
  frontend:
    build: ./frontend
    container_name: math-tutor-frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - math-tutor-network

volumes:
  postgres_data:

networks:
  math-tutor-network:
    driver: bridge